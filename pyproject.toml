[project]
name = "kandinsky-t8"
description = "Native Kandinsky 6 video/audio nodes and single-file INT8 ConvRot conversion"
version = "0.1.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Environment :: GPU :: NVIDIA CUDA"]
dependencies = [
    "comfy-kitchen>=0.2.37",
    "einops>=0.8.0",
    "huggingface-hub>=0.36.0",
    "librosa>=0.10.2",
    "loguru>=0.7.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "safetensors>=0.8.0",
]

[project.urls]
Repository = "https://github.com/T8mars/Comfyui-Kandinsky-T8"
Documentation = "https://github.com/T8mars/Comfyui-Kandinsky-T8#readme"
"Bug Tracker" = "https://github.com/T8mars/Comfyui-Kandinsky-T8/issues"
Models = "https://huggingface.co/t8star/Kandinsky-Comfy"
Upstream = "https://github.com/kandinskylab/kandinsky-6"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "Kandinsky T8"
Icon = "https://avatars.githubusercontent.com/u/242813463?v=4&s=400"
requires-comfyui = ">=0.39.0"
